name: AlgoFlow Solution Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify structure and compile C++ solutions
        run: node .algoflow/verify-solutions.mjs
